name: Backoffice - Build (auto) + Deploy to Cloud Provider (manual)

on:
  push:
    branches: ["main"]

  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (latest or sha-<commit>)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_NAME: inmo24x7-backoffice
  HOST_PORT: "3001"
  CONTAINER_PORT: "80"

jobs:
  build:
    name: Build & Push to GHCR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

      # Required to build ARM64 images from GitHub's AMD64 runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true

          # Oracle Ampere = ARM64
          # AMD64 is kept for compatibility with other providers
          platforms: linux/amd64,linux/arm64

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_USE_SUPABASE_AUTH=${{ vars.VITE_USE_SUPABASE_AUTH }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Cloud (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USERNAME }}
          key: ${{ secrets.CLOUD_SSH_KEY }}

          script: |
            set -euo pipefail

            TAG="${{ inputs.tag }}"
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"

            echo "Deploying ${IMAGE}"

            # Login to GHCR from Oracle VM
            echo "${{ secrets.GHCR_PAT }}" | \
              docker login ghcr.io \
              -u "${{ github.repository_owner }}" \
              --password-stdin

            # Verify image/tag exists
            if ! docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
              echo "ERROR: Image/tag does not exist in GHCR: ${IMAGE}"
              exit 1
            fi

            docker pull "${IMAGE}"

            docker stop "${{ env.CONTAINER_NAME }}" || true
            docker rm "${{ env.CONTAINER_NAME }}" || true

            # Bind only to localhost.
            # Host Caddy will reverse proxy to port 3001.
            docker run -d \
              --name "${{ env.CONTAINER_NAME }}" \
              --restart unless-stopped \
              -p "127.0.0.1:${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }}" \
              "${IMAGE}"

            docker image prune -f

            docker ps --filter "name=${{ env.CONTAINER_NAME }}"